# Flutter platform profile.
# Read by gogox-claude commands at runtime when the resolved platform is "flutter".

deps_install: flutter pub get
test_cmd: /check-test --all --fix
format_cmd: /format --skip-commit
ide_open_hint: "run /work <ticket-id> to start, or /list-worktrees to see all active worktrees"

# --- /ui-tweak skill (UI-Designer mode) ---
# Build-only: confirm the change compiles; no deploy/run/screenshot.
# Generic default (no flavor). Flavored repos override `ui_build_cmd` in <repo>/.gogox-claude.yaml
# (e.g. `--flavor stag --target-platform android-arm64`) to avoid the false "Gradle build failed to
# produce an .apk file" tail and skip the 3x fat-APK assembly. The gate keys on exit code, not log
# text, so the false tail is harmless either way (verify.md Step 1).
ui_build_cmd: flutter build apk --debug   # or `flutter build ios --debug --simulator` on iOS targets

# Phase-1 preview (R18): build the change INTO a device so the designer can SEE it on a real screen
# (NOT build-only anymore). `{device}` is substituted by /ui-tweak:preview after the device cascade
# (use an already-running/connected device incl. physical FIRST → else boot an emulator/simulator →
# else honest skip). `flutter run` covers BOTH Android emulators and iOS simulators, so one template
# serves both. Device discovery uses `flutter devices` / boot uses `flutter emulators --launch <id>`.
# Repo override (e.g. flavor) lives in <repo>/.gogox-claude.yaml.
#
# fvm rewrite: on fvm-pinned repos (.fvmrc / .fvm/fvm_config.json present) the /ui-tweak stages
# rewrite the LEADING `flutter` token of ui_build_cmd / ui_preview_cmd (incl. repo overrides) with
# the resolved binary from .dev/ui-tweak/flutter-bin (e.g. `fvm flutter`). Keep templates written
# with the bare `flutter` token so the rewrite stays mechanical.
ui_preview_cmd: flutter run -d {device} --debug   # repos add their flavor, e.g. `--flavor stag`
