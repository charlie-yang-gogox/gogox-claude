# iOS (native Swift/Xcode) platform profile.
# Read by gogox-claude commands at runtime when the resolved platform is "ios".

deps_install: ""  # varies per project — override in repo .gogox-claude.yaml if needed
test_cmd: bundle exec fastlane ios pr
format_cmd: swiftformat . && swiftlint --fix --quiet && swiftlint --strict
ide_open_hint: "open the .xcworkspace in Xcode"
