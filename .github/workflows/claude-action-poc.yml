name: Claude Action PoC

# Phase 1 of the Linear → GitHub Actions trigger investigation.
# Minimal test: prove `anthropics/claude-code-base-action@beta` runs at all
# inside a GitHub Actions runner, can call Anthropic API with the configured
# secret, and produces some output we can inspect.
#
# After this passes, Phase 2 will live in gogox-client-flutter and run the
# real bug-fix flow (Flutter install + code change + PR open).
#
# Trigger: manual via "Run workflow" button in the Actions tab.

on:
  workflow_dispatch: {}

jobs:
  test-claude-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner info ==="
          uname -a
          cat /etc/os-release | head -5
          echo "=== Tooling baseline ==="
          which gh node npm git curl jq bash
          gh --version | head -1
          echo "=== GitHub context ==="
          echo "repo: ${{ github.repository }}"
          echo "actor: ${{ github.actor }}"
          echo "event: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"

      - name: Run Claude Code (smoke test)
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: |-
            You are running inside a GitHub Actions runner. Do these three steps via the Bash tool and report back inline:

            1. Run `uname -a && whoami` and quote the output.
            2. Run `ls -la "$GITHUB_WORKSPACE"` and quote the first 10 lines.
            3. Run `gh auth status` (do NOT echo the token) and quote the output.

            End your reply with the literal line:
            === CLAUDE PoC SMOKE COMPLETE ===
          allowed_tools: "Bash,Read,Glob,Grep"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          max_turns: "10"

      - name: Show execution summary
        if: always()
        run: |
          echo "=== Claude Code conclusion ==="
          echo "Conclusion: ${{ steps.run-claude.outputs.conclusion || 'see action output above' }}"
