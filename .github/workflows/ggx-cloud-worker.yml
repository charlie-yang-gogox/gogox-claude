name: GGX Cloud Bug Worker

# P2 of the Linear → GitHub Actions trigger investigation.
# End-to-end equivalent of PoC-4 (CCR sandbox) but running in a GitHub
# Actions runner. Driven by a Linear ticket id, this workflow installs
# gogox-claude + Flutter, then runs claude-code-base-action with a
# bug-fix prompt. Claude opens a PR on gogovan/gogox-client-flutter via
# the gh CLI.

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Linear ticket id (e.g. CAF-603)"
        required: true
        type: string
  repository_dispatch:
    types: [linear-bug-fix]

env:
  TARGET_REPO: gogovan/gogox-client-flutter

jobs:
  fix-bug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Resolve ticket id
        id: ticket
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ID="${{ github.event.client_payload.ticket_id }}"
          else
            ID="${{ github.event.inputs.ticket_id }}"
          fi
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Ticket: ${ID}"

      - name: Checkout gogox-claude (this repo)
        uses: actions/checkout@v4
        with:
          path: gogox-claude

      - name: Checkout target repo (gogovan/gogox-client-flutter)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Flutter 3.38.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable

      - name: Configure git (insteadOf + safe.directory + gh auth)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global --add safe.directory '*'
          # Rewrite ssh / git@ → HTTPS+PAT so Dart pub git: deps (flutter-core-sdk) resolve
          git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf 'git@github.com:'
          git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf 'ssh://git@github.com/'
          # Identity for any commits Claude makes
          git config --global user.email "ggx-cloud-worker@gogox.local"
          git config --global user.name  "ggx-cloud-worker"
          # gh CLI auth (runner has no token by default)
          echo "$GH_PAT" | gh auth login --with-token
          gh auth status

      - name: Install gogox-claude into ~/.claude
        run: |
          cd "$GITHUB_WORKSPACE/gogox-claude"
          bash install.sh
          # Sanity: critical artifacts in place
          for f in \
            "$HOME/.claude/commands/ggx-work.md" \
            "$HOME/.claude/commands/dev/ff.md" \
            "$HOME/.claude/lib/dev-mode.sh"; do
            if [ ! -e "$f" ]; then
              echo "BOOTSTRAP FAILED: $f missing"
              exit 1
            fi
          done
          echo "gogox-claude bootstrap OK"

      - name: Pre-flight pub get
        run: |
          cd "$GITHUB_WORKSPACE/target"
          flutter --version | head -3
          flutter pub get 2>&1 | tail -10

      - name: Run Claude bug-fix flow
        uses: anthropics/claude-code-base-action@beta
        with:
          # Claude runs in $GITHUB_WORKSPACE/target so it reads .claude/, CLAUDE.md
          # of the target repo automatically.
          prompt: |-
            You are running inside a GitHub Actions runner as the **cloud bug worker** for the gogox-claude pipeline.

            ## Ticket
            - Linear ticket ID: ${{ steps.ticket.outputs.id }}
            - Repository: gogovan/gogox-client-flutter (already checked out at $GITHUB_WORKSPACE/target)
            - Working dir: cd to $GITHUB_WORKSPACE/target before doing any work

            ## Your job
            Drive this Linear ticket through the equivalent of `/ggx-work <ticket-id> --auto` (bug lane). The full pipeline definition is in ~/.claude/commands/ggx-work.md and ~/.claude/commands/dev/*.md — read them and follow.

            For bug-mode the chain is: dev:start → write the fix → dev:verify → dev:review → dev:ship.

            ## Cloud-specific overrides (apply throughout)
            1. cd "$GITHUB_WORKSPACE/target" first; do NOT cd elsewhere.
            2. `gh` CLI is installed and authenticated via $GH_TOKEN env (the workflow already ran `gh auth login --with-token`). Use `gh pr create`, `gh pr list`, `gh pr view` directly — no MCP needed.
            3. Branch naming: use the gitBranchName from the Linear ticket (fetch via `mcp__claude_ai_Linear__get_issue`) OR fall back to `fix/<TICKET-ID>`. Create the branch off `trunk`.
            4. Flutter SDK is at /opt/hostedtoolcache/flutter/... or on PATH. `flutter --version` should show 3.38.7. `flutter pub get` was already run.
            5. `flutter test` may be slow — run it once if the change touches Dart code; for pure-doc changes (e.g. README only) you can skip test, but still run `flutter analyze`.
            6. When committing: `git commit -m "<message>" --no-verify` is fine; use the configured ggx-cloud-worker identity (already set globally).
            7. When done: report PR number + URL + Linear status transition.

            ## Linear MCP usage
            Use `mcp__claude_ai_Linear__*` tools for ticket read / status update / comment posting. Do NOT skip the starting `<!-- ticket-init:v1 lane=dev -->` comment or the closing summary comment — match what /dev:start and /dev:ship do.

            ## Safety rails
            - Do NOT force-push to trunk
            - Do NOT delete any remote branch you did not create
            - Do NOT touch ANY ticket other than ${{ steps.ticket.outputs.id }}
            - If anything looks unsafe or unrecoverable, stop and report

            ## Output
            End your final reply with the literal line block:

            === GGX CLOUD WORKER OUTCOME ===
            Result       : <success | failure>
            Final stage  : <e.g. dev:ship | dev:verify aborted>
            Ticket status: <Linear status name>
            PR URL       : <URL or none>
            Files changed: <N files (summary)>
            Notes        : <any noteworthy gotcha>
            === GGX CLOUD WORKER COMPLETE ===
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          max_turns: "80"
          claude_env: |
            GH_TOKEN: ${{ secrets.GH_PAT }}
            GH_PAT: ${{ secrets.GH_PAT }}

      - name: Show summary
        if: always()
        run: |
          echo "=== Workflow finished ==="
          echo "Ticket: ${{ steps.ticket.outputs.id }}"
          echo "(see Claude action output above for outcome block)"
