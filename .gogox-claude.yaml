# Linear → dev → PR pipeline (/ticket-analyze → /ggx-dispatcher → /ggx-work → /route).
#
# Resolved first by every gogox-claude command's "Step 0: resolve profile"
# (before the per-machine registry fallback). Committed on purpose: co-owners
# clone the repo and inherit it — no per-machine setup. See
# plans/ggx-claude-self-dev-workflow.md.

